name: docs

on:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md docs
      - name: Fail on placeholder strings
        run: |
          paths="README.md"
          if [ -d docs ]; then
            paths="$paths docs"
          fi
          if command -v rg >/dev/null 2>&1; then
            matches=$(rg -n --no-heading -g '!notes/**' \
              -e 'your-org' -e 'github:you/' -e 'TODO' -e 'TBD' \
              -e 'coming soon' -e 'see defaults/schema' $paths || true)
          else
            matches=$(grep -RInE --exclude-dir=notes \
              'your-org|github:you/|TODO|TBD|coming soon|see defaults/schema' $paths || true)
          fi
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            exit 1
          fi

  options:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Regenerate options reference
        run: ./scripts/gen-options.sh

      - name: Fail when OPTIONS.md is stale
        run: git diff --exit-code -- OPTIONS.md
