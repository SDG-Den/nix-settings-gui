[package]
name = "nix-settings-gui"
version = "0.1.0"
edition = "2021"
description = "A comment-driven settings GUI for Nix"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
rnix = "0.11"
rowan = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2"
libc = "0.2"
regex = "1"

[[bin]]
name = "nix-settings-gui"
path = "src/main.rs"

[profile.release]
opt-level = 1
codegen-units = 256
panic = "abort"
debug = false

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"

[dev-dependencies]
serde_yaml = "0.9.34"
